<!doctype html>
<html lang="%LANG%" dir="%DIR%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#060608" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%URL%" />
    <link rel="alternate" hreflang="fa" href="%URL%?lang=fa" />
    <link rel="alternate" hreflang="en" href="%URL%?lang=en" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%URL%" />
    <meta property="og:image" content="%URL%og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TITLE%" />
    <meta name="twitter:description" content="%DESCRIPTION%" />
    <meta name="twitter:image" content="%URL%og.jpg" />

    <script type="application/ld+json">%JSONLD%</script>
    <script>
      // A fresh visit starts at the top, even inside hosts that restore the previous page's
      // scroll position. Reloads, back/forward and #section links keep their usual behaviour,
      // and the first scroll, tap or key press ends the hold.
      (function () {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (location.hash || (nav && nav.type !== 'navigate')) return;
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var held = true;
        var top = function () {
          if (held) window.scrollTo(0, 0);
        };
        ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (t) {
          addEventListener(t, function () { held = false; }, { once: true, passive: true });
        });
        addEventListener('DOMContentLoaded', top);
        addEventListener('load', function () {
          top();
          setTimeout(top, 150);
          setTimeout(top, 500);
          setTimeout(function () { held = false; }, 900);
        });
      })();
    </script>
    <script>
      document.documentElement.classList.add('js');
      try {
        if (sessionStorage.getItem('ro:visited')) document.documentElement.classList.add('is-return');
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">%SKIP%</a>
    %PRELOADER%
    <canvas class="gl" data-gl-canvas aria-hidden="true"></canvas>
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>
    <div class="cursor" data-cursor-root aria-hidden="true">
      <div class="cursor-follow" data-cursor-ring>
        <div class="cursor-ring"></div>
        <div class="cursor-disc"><span class="cursor-label" data-cursor-label></span></div>
      </div>
      <div class="cursor-dot" data-cursor-dot></div>
    </div>
    <div id="app">%APP%</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
