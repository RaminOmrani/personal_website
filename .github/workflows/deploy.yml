name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json
            v3/package-lock.json
      - run: npm ci
      - run: npm run build
      # v2 (the light, React redesign) is published next to v1, at /v2/
      - name: Build v2
        working-directory: v2
        run: |
          npm ci
          npm run build
      - run: cp -r v2/dist dist/v2
      # v3 (the cinematic 3D version) is published at /v3/
      - name: Build v3
        working-directory: v3
        run: |
          npm ci
          npm run build
      - run: cp -r v3/dist dist/v3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
