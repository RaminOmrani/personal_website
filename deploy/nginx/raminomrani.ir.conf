# raminomrani.ir on Nginx (Ubuntu/Debian VPS). A static site: the chooser at /,
# the versions at /v1/ /v2/ /v3/ and the installable app at /app/.
#
# deploy/setup-server.sh installs this for you, and rewrites it on every --update: as it is while
# there is no certificate, and with HTTPS (port 443, http → https) once there is one. By hand:
#   1. Upload the contents of ./site to /var/www/raminomrani.ir
#   2. sudo cp raminomrani.ir.conf /etc/nginx/sites-available/
#      sudo ln -s /etc/nginx/sites-available/raminomrani.ir.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d raminomrani.ir -d www.raminomrani.ir
#      (certbot adds HTTPS and the http → https redirect to this block by itself)

# how long browsers may keep each kind of file
map $uri $ro_cache {
    default                   "public, max-age=604800";
    ~*/assets/                "public, max-age=31536000, immutable";
    ~*/sw\.js$                "no-cache";
    ~*\.webmanifest$          "no-cache";
    ~*\.html$                 "no-cache";
    ~*/$                      "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name raminomrani.ir www.raminomrani.ir;

    root /var/www/raminomrani.ir;
    index index.html;
    charset utf-8;

    # one address for everyone: www → the bare domain
    if ($host = www.raminomrani.ir) {
        return 301 $scheme://raminomrani.ir$request_uri;
    }

    add_header Cache-Control $ro_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # once HTTPS works for a few days, uncomment to make browsers always use it:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # /v3/en serves /v3/en.html; folders serve their index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # the Android app (PWABuilder / TWA) proves it belongs to this site here
    location ^~ /.well-known/ {
        default_type application/json;
    }

    # the Android app for direct download; files here are kept when the site is updated
    location ^~ /downloads/ {
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # server config files are never served
    location ~ /(\.ht|web\.config) {
        deny all;
    }

    error_page 404 /404.html;
}
