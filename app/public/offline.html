<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" />
    <title>آفلاین · رامین عمرانی</title>
    <style>
      html { -webkit-tap-highlight-color: transparent; background: #f6f4ef; color: #0f1b2d; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 16px/1.8 Vazirmatn, Tahoma, system-ui, sans-serif; text-align: center; }
      main { padding: 24px; max-width: 360px; }
      svg { width: 72px; height: 72px; margin: 0 auto 16px; display: block; }
      h1 { margin: 0 0 6px; font-size: 21px; }
      p { margin: 0 0 4px; color: #43506a; }
      p[lang='en'] { font-size: 14px; }
      button { margin-top: 18px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #1f52d6; color: #fff; font: inherit; font-weight: 700; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2356D6" /><stop offset=".55" stop-color="#1673C4" /><stop offset="1" stop-color="#0E9AA7" /></linearGradient>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8CF7A" /><stop offset="1" stop-color="#E0962F" /></linearGradient>
        </defs>
        <rect x="2" y="2" width="116" height="116" rx="32" fill="url(#t)" />
        <path d="M31 99 V60 C31 43 43 30 60 20 C77 30 89 43 89 60 V99" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round" />
      </svg>
      <h1>اینترنت در دسترس نیست</h1>
      <p>وقتی دوباره وصل شدید، اپ از همان‌جا ادامه می‌دهد.</p>
      <p lang="en" dir="ltr">You’re offline. The app will pick up where you left off once you’re back online.</p>
      <button type="button" onclick="location.href = './'">تلاش دوباره · Try again</button>
    </main>
  </body>
</html>
